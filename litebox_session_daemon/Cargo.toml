[package]
name = "litebox_session_daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
litebox_termemu = { version = "0.1.0", path = "../litebox_termemu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.60.2", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[lints]
workspace = true
