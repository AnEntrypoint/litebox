name: BugE Native Linux Repro (throwaway diagnostic)

on:
  workflow_dispatch: {}

jobs:
  stress_test:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Show exact musl/busybox versions
        run: |
          cat /etc/os-release
          apk info -v musl busybox 2>&1 || true

      - name: Install busybox-static and python3 (match project's rootfs toolchain)
        run: |
          apk add --no-cache busybox-static python3

      - name: Stress test 'true | true' via /bin/sh (busybox ash) x5000
        run: |
          set +e
          fail=0
          for i in $(seq 1 5000); do
            out=$(/bin/sh -c 'true | true; echo EXIT=$?' 2>&1)
            code=$?
            if [ $code -ne 0 ] || ! echo "$out" | grep -q "EXIT=0"; then
              echo "ITERATION $i FAILED (exit=$code): $out"
              fail=$((fail+1))
            fi
          done
          echo "Total failures out of 5000: $fail"
          if [ $fail -gt 0 ]; then
            echo "REPRODUCED ON REAL LINUX: true|true crashed/misbehaved $fail/5000 times"
          else
            echo "DID NOT REPRODUCE: true|true was clean 5000/5000 times on real Linux"
          fi

      - name: Stress test 'true | true | true' x2000
        run: |
          set +e
          fail=0
          for i in $(seq 1 2000); do
            out=$(/bin/sh -c 'true | true | true; echo EXIT=$?' 2>&1)
            code=$?
            if [ $code -ne 0 ] || ! echo "$out" | grep -q "EXIT=0"; then
              echo "ITERATION $i FAILED (exit=$code): $out"
              fail=$((fail+1))
            fi
          done
          echo "Total failures out of 2000: $fail"

      - name: Stress test python3 pty.spawn x500
        run: |
          set +e
          fail=0
          for i in $(seq 1 500); do
            out=$(python3 -c "import pty,sys; rc=pty.spawn(['/bin/echo','pty-smoke-ok']); sys.exit(rc if isinstance(rc,int) else 0)" 2>&1)
            code=$?
            if [ $code -ne 0 ] || ! echo "$out" | grep -q "pty-smoke-ok"; then
              echo "ITERATION $i FAILED (exit=$code): $out"
              fail=$((fail+1))
            fi
          done
          echo "Total failures out of 500: $fail"
          if [ $fail -gt 0 ]; then
            echo "REPRODUCED ON REAL LINUX: pty.spawn crashed/misbehaved $fail/500 times"
          else
            echo "DID NOT REPRODUCE: pty.spawn was clean 500/500 times on real Linux"
          fi

      - name: Also stress under busybox-static explicitly (in case apk's ash differs from busybox-static's)
        run: |
          set +e
          fail=0
          for i in $(seq 1 2000); do
            out=$(busybox sh -c 'true | true; echo EXIT=$?' 2>&1)
            code=$?
            if [ $code -ne 0 ] || ! echo "$out" | grep -q "EXIT=0"; then
              echo "ITERATION $i FAILED (exit=$code): $out"
              fail=$((fail+1))
            fi
          done
          echo "Total busybox-static failures out of 2000: $fail"
