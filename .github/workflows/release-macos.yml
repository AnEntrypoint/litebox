name: Release macOS build verification

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build_macos:
    name: Build macOS (Apple Silicon) platform crates
    runs-on: macos-14
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - name: Check out repo
        uses: actions/checkout@v6
      - name: Set up Rust
        run: |
          rustup toolchain install $(awk -F'"' '/channel/{print $2}' rust-toolchain.toml) --profile minimal --no-self-update --target aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos
      - name: Build the portable raw OCI library and macOS platform
        run: cargo build --locked --release -p litebox_packager -p litebox_platform_macos_userland
      - name: Verify the image reference is digest-pinned
        run: grep -Eq '^docker\.io/linuxserver/webtop@sha256:[0-9a-f]{64}$' dist_tools/webtop-image.ref
      - name: Assemble build-verification bundle
        run: |
          mkdir -p bundle
          cp dist_tools/webtop-image.ref bundle/
          cp docs/macos.md bundle/README.md
          tar -C bundle -czf litebox-macos-build-verification.tar.gz .
      - name: Upload build-verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: litebox-macos-build-verification
          path: litebox-macos-build-verification.tar.gz
          if-no-files-found: error
      - name: Publish GitHub release (build-verification artifact only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: litebox-macos-build-verification.tar.gz
          append_body: true
          body: |
            ---
            **`litebox-macos-build-verification.tar.gz` is a build-verification artifact, not a functional release.**
            Guest entry is not implemented for macOS/Apple Silicon -- see `docs/macos.md`.
