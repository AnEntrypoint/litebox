name: Webtop image pin

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify_pin:
    name: Digest pin resolves for both host architectures
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6
      - name: Verify the pinned OCI index
        run: |
          ref=$(cat dist_tools/webtop-image.ref)
          test "${ref#*@sha256:}" != "$ref"
          digest=${ref#*@}
          token=$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:linuxserver/webtop:pull" | jq -r .token)
          curl -fsSL -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://registry-1.docker.io/v2/linuxserver/webtop/manifests/$digest" > index.json
          for arch in amd64 arm64; do
            jq -e --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)' index.json > /dev/null
            echo "pinned index carries linux/$arch"
          done
