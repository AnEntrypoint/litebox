name: Debug Build Environment

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_debug_artifacts:
    name: Build debug-symboled musl and OpenSSL
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install general-purpose build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential musl-tools musl-dev linux-libc-dev gdb binutils python3-pip python3-venv
          # musl-gcc's own sysroot lacks the Linux kernel UAPI headers (linux/mman.h etc);
          # symlink the system ones in so musl-gcc can find them.
          MUSL_INCLUDE=$(dirname "$(musl-gcc -print-file-name=include/stddef.h)")
          sudo ln -sf /usr/include/linux "$MUSL_INCLUDE/linux"
          sudo ln -sf /usr/include/asm-generic "$MUSL_INCLUDE/asm-generic"
          sudo ln -sf /usr/include/x86_64-linux-gnu/asm "$MUSL_INCLUDE/asm"
      - name: Fetch musl 1.2.6 source
        run: |
          curl -sL https://musl.libc.org/releases/musl-1.2.6.tar.gz -o /tmp/musl-1.2.6.tar.gz
          tar -xf /tmp/musl-1.2.6.tar.gz -C /tmp
      - name: Instrument __copy_tls/static_init_tls/__init_tp with debug prints
        run: |
          cd /tmp/musl-1.2.6
          python3 - << 'PYEOF'
          path = "src/env/__init_tls.c"
          src = open(path).read()
          assert "if (libc.tls_size > sizeof builtin_tls) {" in src, "anchor 1 not found"
          assert "if (__init_tp(__copy_tls(mem)) < 0)" in src, "anchor 2 not found"

          src = src.replace(
              "if (libc.tls_size > sizeof builtin_tls) {",
              'fprintf(stderr, "TLS_DEBUG: tls_size=%zu builtin_tls_size=%zu tls_align=%zu main_tls.size=%zu main_tls.offset=%zu\\n", libc.tls_size, sizeof(builtin_tls), libc.tls_align, main_tls.size, main_tls.offset);\n\tif (libc.tls_size > sizeof builtin_tls) {'
          )
          src = src.replace(
              "if (__init_tp(__copy_tls(mem)) < 0)",
              'fprintf(stderr, "TLS_DEBUG: mem=%p\\n", mem);\n\tif (__init_tp(__copy_tls(mem)) < 0)'
          )
          src = "#include <stdio.h>\n" + src
          open(path, "w").write(src)

          path = "src/env/__libc_start_main.c"
          src = open(path).read()
          assert "__init_tls(aux);" in src, "anchor 3 not found"
          src = src.replace(
              "__init_tls(aux);",
              'fprintf(stderr, "TLS_DEBUG: AT_PAGESZ=%zu AT_PHDR=%zu AT_PHENT=%zu AT_PHNUM=%zu AT_RANDOM=%zu AT_SECURE=%zu AT_HWCAP=%zu\\n", aux[AT_PAGESZ], aux[AT_PHDR], aux[AT_PHENT], aux[AT_PHNUM], aux[AT_RANDOM], aux[AT_SECURE], aux[AT_HWCAP]);\n\t__init_tls(aux);'
          )
          src = "#include <stdio.h>\n" + src
          open(path, "w").write(src)
          PYEOF

          # Also trace __init_tp itself (in __init_tls.c) since that's where td->next=td is set.
          python3 - << 'PYEOF'
          path = "src/env/__init_tls.c"
          src = open(path).read()
          src = src.replace(
              "td->next = td->prev = td;",
              'td->next = td->prev = td;\n\tfprintf(stderr, "TLS_DEBUG: __init_tp td=%p td->self=%p td->next=%p td->prev=%p\\n", (void*)td, (void*)td->self, (void*)td->next, (void*)td->prev);'
          )
          open(path, "w").write(src)
          PYEOF

          # Trace pthread_key_delete's thread-list walk, the exact site of the litebox crash.
          python3 - << 'PYEOF'
          path = "src/thread/pthread_key_create.c"
          src = open(path).read()
          assert 'do td->tsd[k] = 0;' in src, "anchor 5 not found"
          src = src.replace(
              "pthread_t self = __pthread_self(), td=self;",
              'pthread_t self = __pthread_self(), td=self;\n\tfprintf(stderr, "TLS_DEBUG: pthread_key_delete self=%p self->next=%p self->self=%p\\n", (void*)self, (void*)self->next, (void*)self->self);'
          )
          src = "#include <stdio.h>\n" + src
          open(path, "w").write(src)
          PYEOF
          grep -n "TLS_DEBUG" src/env/__init_tls.c src/env/__libc_start_main.c src/thread/pthread_key_create.c
      - name: Build instrumented musl 1.2.6 with debug symbols (Alpine-matched -Os -g)
        run: |
          cd /tmp/musl-1.2.6
          CFLAGS='-Os -g' ./configure --prefix=/tmp/musl-install
          make -j"$(nproc)"
      - name: Fetch OpenSSL 3.5.7 source (exact version deployed in the Alpine rootfs)
        run: |
          curl -sL https://github.com/openssl/openssl/archive/refs/tags/openssl-3.5.7.tar.gz -o /tmp/openssl-3.5.7.tar.gz
          tar -xf /tmp/openssl-3.5.7.tar.gz -C /tmp
      - name: Cross-compile OpenSSL 3.5.7 against musl with debug symbols
        run: |
          cd /tmp/openssl-openssl-3.5.7
          CC=musl-gcc ./Configure linux-x86_64 -g -O0 no-shared no-tests --prefix=/tmp/openssl-install
          make -j"$(nproc)"
      - name: Build a minimal EVP_MD_fetch reproduction against the debug OpenSSL
        run: |
          mkdir -p /tmp/repro
          cat > /tmp/repro/evpfetch_repro.c << 'EOF'
          #include <stdio.h>
          #include <openssl/evp.h>
          int main(void) {
              printf("EVPFETCH-REPRO-START\n");
              fflush(stdout);
              EVP_MD *sha1 = EVP_MD_fetch(NULL, "sha1", NULL);
              printf("sha1 fetch: %p\n", (void *)sha1);
              fflush(stdout);
              printf("EVPFETCH-REPRO-PASS\n");
              return 0;
          }
          EOF
          musl-gcc -g -O0 -static -I/tmp/openssl-openssl-3.5.7/include \
            -o /tmp/repro/evpfetch_repro /tmp/repro/evpfetch_repro.c \
            /tmp/openssl-openssl-3.5.7/libssl.a /tmp/openssl-openssl-3.5.7/libcrypto.a -ldl -lpthread
      - name: Build a DYNAMICALLY-linked reproduction (matches litebox/apk's real ld.so codepath)
        run: |
          # Rebuild OpenSSL itself as real shared objects against the instrumented musl,
          # so the reproduction goes through ld.so's own static_init_tls at load time,
          # exactly like apk/litebox does -- the earlier -static build bypasses ld.so entirely.
          cd /tmp/openssl-openssl-3.5.7
          make clean > /dev/null 2>&1 || true
          CC=musl-gcc ./Configure linux-x86_64 -g -O0 shared no-tests --prefix=/tmp/openssl-install-shared
          make -j"$(nproc)"
          musl-gcc -g -O0 -I/tmp/openssl-openssl-3.5.7/include \
            -o /tmp/repro/evpfetch_repro_dyn /tmp/repro/evpfetch_repro.c \
            -L/tmp/openssl-openssl-3.5.7 -lssl -lcrypto -Wl,-rpath,/tmp/openssl-openssl-3.5.7
      - name: Install the instrumented musl ld.so over the system copy so the dynamic repro actually uses it
        run: |
          # musl-gcc links against the SYSTEM /lib/ld-musl-x86_64.so.1 by default;
          # the freshly-built instrumented libc.so at /tmp/musl-1.2.6/lib/libc.so is
          # a separate file until installed over that path.
          ls -la /lib/ld-musl-x86_64.so.1
          sudo cp /tmp/musl-1.2.6/lib/libc.so /lib/ld-musl-x86_64.so.1
      - name: Run the dynamically-linked reproduction natively on Linux as a real-Linux control (with TLS debug trace)
        run: |
          LD_LIBRARY_PATH=/tmp/openssl-openssl-3.5.7 /tmp/repro/evpfetch_repro_dyn 2>&1 | tee /tmp/repro/tls_debug_trace.txt
          echo "exit code: $?"
      - name: Run under gdb with full backtrace and thread-struct inspection as a reference trace
        run: |
          cat > /tmp/gdb_ci.txt << 'EOF'
          run
          bt full
          info threads
          quit
          EOF
          gdb -batch -x /tmp/gdb_ci.txt /tmp/repro/evpfetch_repro 2>&1 | tee /tmp/repro/gdb_reference_trace.txt
      - name: Package debug artifacts
        run: |
          mkdir -p /tmp/artifacts
          cp /tmp/musl-1.2.6/lib/libc.so /tmp/artifacts/musl-libc-debug.so
          cp -r /tmp/musl-1.2.6/obj /tmp/artifacts/musl-obj-debug || true
          cp /tmp/openssl-openssl-3.5.7/libssl.a /tmp/openssl-openssl-3.5.7/libcrypto.a /tmp/artifacts/ 2>/dev/null || true
          cp /tmp/repro/evpfetch_repro /tmp/artifacts/
          cp /tmp/repro/evpfetch_repro_dyn /tmp/artifacts/ 2>/dev/null || true
          cp /tmp/repro/tls_debug_trace.txt /tmp/artifacts/ 2>/dev/null || true
          cp /tmp/repro/gdb_reference_trace.txt /tmp/artifacts/
          objdump -d /tmp/repro/evpfetch_repro > /tmp/artifacts/evpfetch_repro_disasm.txt
          nm /tmp/repro/evpfetch_repro > /tmp/artifacts/evpfetch_repro_symbols.txt
      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: musl-openssl-debug-artifacts
          path: /tmp/artifacts/

  build_busybox_debug:
    name: Build debug-symboled BusyBox ash (for the fork/&&-hang investigation)
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install general-purpose build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential musl-tools musl-dev linux-libc-dev gdb binutils python3-pip python3-venv bc
          MUSL_INCLUDE=$(dirname "$(musl-gcc -print-file-name=include/stddef.h)")
          sudo ln -sf /usr/include/linux "$MUSL_INCLUDE/linux"
          sudo ln -sf /usr/include/asm-generic "$MUSL_INCLUDE/asm-generic"
          sudo ln -sf /usr/include/x86_64-linux-gnu/asm "$MUSL_INCLUDE/asm"
      - name: Fetch BusyBox 1.37.0 source (exact version deployed in the Alpine rootfs)
        run: |
          curl -sL https://busybox.net/downloads/busybox-1.37.0.tar.bz2 -o /tmp/busybox-1.37.0.tar.bz2
          tar -xf /tmp/busybox-1.37.0.tar.bz2 -C /tmp
      - name: Configure BusyBox minimally (ash + a few coreutils only -- avoids chasing every applet's kernel headers)
        run: |
          cd /tmp/busybox-1.37.0
          make allnoconfig
          # Only what the fork/&&-hang repro actually needs; a minimal config sidesteps every
          # applet that wants headers musl-gcc's sysroot doesn't carry (tc, nandwrite, etc).
          # `yes "" | make oldconfig` accepts KCONFIG *defaults* for anything prompted after a
          # dependency reset, silently dropping options appended by hand -- use
          # KCONFIG_ALLCONFIG so every listed symbol is force-applied instead.
          cat > /tmp/busybox_extra.config << 'EOF'
          CONFIG_DEBUG=y
          CONFIG_ASH=y
          CONFIG_ASH_JOB_CONTROL=y
          CONFIG_ASH_ALIAS=y
          CONFIG_ASH_GETOPTS=y
          CONFIG_ASH_BUILTIN_ECHO=y
          CONFIG_ASH_BUILTIN_TEST=y
          CONFIG_FEATURE_SH_IS_ASH=y
          CONFIG_ECHO=y
          CONFIG_LS=y
          CONFIG_TRUE=y
          CONFIG_FALSE=y
          CONFIG_CAT=y
          CONFIG_FEATURE_PREFER_APPLETS=y
          CONFIG_BUSYBOX=y
          CONFIG_FEATURE_INSTALLER=n
          EOF
          KCONFIG_ALLCONFIG=/tmp/busybox_extra.config make oldconfig CC=musl-gcc
          grep -E "CONFIG_ASH=|CONFIG_ASH_JOB_CONTROL=|CONFIG_DEBUG=" .config
      - name: Build BusyBox with debug symbols against musl
        run: |
          cd /tmp/busybox-1.37.0
          sed -i 's/^CONFIG_STRIP=y/# CONFIG_STRIP is not set/' .config || true
          # busybox's own link step passes `-s` (strip) via LDFLAGS regardless of CONFIG_STRIP
          # unless overridden; NOSTRIP=1 alone doesn't stop it, so force LDFLAGS empty too.
          make -j"$(nproc)" CC=musl-gcc EXTRA_CFLAGS="-g -O0" LDFLAGS="" NOSTRIP=1 SKIP_STRIP=y
          file busybox
          nm busybox | wc -l
      - name: Reproduce the fork/&&-hang under gdb with real symbols
        run: |
          cd /tmp/busybox-1.37.0
          ln -sf busybox sh
          ln -sf busybox echo
          ln -sf busybox true
          cat > /tmp/gdb_repro.txt << 'EOF'
          set pagination off
          run -c "/tmp/busybox-1.37.0/echo child_out; echo AFTER_SEMICOLON"
          EOF
          timeout 8 gdb -batch -x /tmp/gdb_repro.txt ./sh > /tmp/native_repro.txt 2>&1 || true
          echo "--- native run (real Linux, real musl, should NOT hang) ---"
          cat /tmp/native_repro.txt
      - name: Package debug artifacts
        run: |
          mkdir -p /tmp/artifacts2
          cp /tmp/busybox-1.37.0/busybox /tmp/artifacts2/busybox-debug
          cp /tmp/native_repro.txt /tmp/artifacts2/ 2>/dev/null || true
          objdump -d /tmp/busybox-1.37.0/busybox > /tmp/artifacts2/busybox_disasm.txt
          nm /tmp/busybox-1.37.0/busybox > /tmp/artifacts2/busybox_symbols.txt 2>/dev/null || true
          cd /tmp/artifacts2
          for applet in sh ash echo ls true false cat; do ln -sf busybox-debug "$applet"; done
          tar -cf busybox-debug-with-symlinks.tar busybox-debug sh ash echo ls true false cat
      - name: Upload BusyBox debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: busybox-debug-artifacts
          path: /tmp/artifacts2/
