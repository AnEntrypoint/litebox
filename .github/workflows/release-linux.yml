name: Release Linux runner

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build thin runner and smoke test raw OCI
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - name: Check out repo
        uses: actions/checkout@v6
      - name: Set up Rust
        run: |
          rustup toolchain install $(awk -F'"' '/channel/{print $2}' rust-toolchain.toml) --profile minimal --no-self-update --target x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-runner
      - name: Build litebox_runner_linux_userland (release)
        run: cargo build --locked --release -p litebox_runner_linux_userland
      - name: Raw OCI smoke (unmodified layers, no rewriting)
        run: |
          smoke_ref=$(cat dist_tools/smoke-image.ref)
          output=$(timeout 300 ./target/release/litebox_runner_linux_userland --oci-image "$smoke_ref" /bin/echo raw-oci-smoke-ok)
          echo "$output"
          test "${output#*raw-oci-smoke-ok}" != "$output"
      - name: Verify the image reference is digest-pinned
        run: grep -Eq '^docker\.io/linuxserver/webtop@sha256:[0-9a-f]{64}$' dist_tools/webtop-image.ref
      - name: Assemble thin bundle
        run: |
          mkdir -p bundle
          cp target/release/litebox_runner_linux_userland bundle/
          cp dist_tools/webtop-image.ref dist_tools/smoke-image.ref dist_tools/run-webtop.sh bundle/
          cp dist_tools/README-linux.md bundle/README.md
          chmod +x bundle/litebox_runner_linux_userland bundle/run-webtop.sh
          tar -C bundle -czf litebox-linux-webtop.tar.gz .
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: litebox-linux-webtop
          path: litebox-linux-webtop.tar.gz
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: litebox-linux-webtop.tar.gz
          generate_release_notes: true
