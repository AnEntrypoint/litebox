[package]
name = "litebox_packager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
flate2 = "1.1"
futures-util = "0.3"
memmap2 = "0.9.8"
oci-client = { version = "0.16", default-features = false, features = ["native-tls"] }
oci-spec = { version = "0.9", features = ["image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "fs", "io-util"] }

[lints]
workspace = true
