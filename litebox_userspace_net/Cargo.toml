[package]
name = "litebox_userspace_net"
version = "0.1.0"
edition = "2024"

[dependencies]
litebox = { path = "../litebox", version = "0.1.0" }
litebox_util_log = { path = "../litebox_util_log", version = "0.1.0", features = [
    "backend_tracing",
] }
smoltcp = { version = "0.12.0", default-features = false, features = [
    "log",
    "proto-ipv4",
    "medium-ip",
    "socket",
    "socket-tcp",
    "socket-udp",
    "std",
] }
socket2 = "0.6"

[lints]
workspace = true
