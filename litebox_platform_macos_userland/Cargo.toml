[package]
name = "litebox_platform_macos_userland"
version = "0.1.0"
edition = "2024"

# The crate body is gated to macOS on Apple Silicon, so on every other host it
# compiles to nothing and needs none of these.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
libc = { version = "0.2.169", default-features = false }
litebox = { path = "../litebox/", version = "0.1.0" }
litebox_common_linux = { path = "../litebox_common_linux", version = "0.1.0" }
litebox_util_log = { version = "0.1.0", path = "../litebox_util_log" }
zerocopy = { version = "0.8", default-features = false }
# GUI application support (DRM/KMS dumb-buffer emulation's host-side presentation layer, see
# `src/presentation.rs`): ports `litebox_platform_windows_userland`'s presentation module, with a
# threading architecture inverted from Windows/Linux userland -- Cocoa/AppKit's `winit` backend has
# no `with_any_thread` escape hatch (confirmed by reading `winit`'s own `src/platform/macos.rs`:
# unlike the Windows/X11/Wayland platform modules, it defines none), so `Presenter::run` must be
# called from the process's real main thread instead of a dedicated background thread. `wgpu`
# resolves to its Metal backend here by default; no forced-backend override is applicable.
wgpu = "27"
winit = "0.30"
pollster = "0.4"

[lints]
workspace = true
